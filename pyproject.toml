[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-control"
version = "0.5.0"
description = "MCP server for coordinating Claude Code instances across multiple projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Red Duck Labs", email = "support@redducklabs.com"}
]
keywords = ["mcp", "claude", "claude-code", "automation", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4.0.0",
    "claude-code-sdk>=0.0.25",
    "mcp>=1.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "trio>=0.34.0,<0.35",
    "black>=26.10.1,<27",
    "ruff>=0.17.0,<0.18",
    "mypy>=2.4.0,<3",
    "coverage>=7.16.2,<8",
    "build>=1.6.1,<2",
]

[project.scripts]
claude-control = "claude_control.server:main"

[project.urls]
Homepage = "https://github.com/redducklabs/claude-control"
Repository = "https://github.com/redducklabs/claude-control"
Issues = "https://github.com/redducklabs/claude-control/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_control*"]

[tool.setuptools.package-data]
"claude_control.isolated" = ["resources/*.json"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["claude_control"]
branch = true
data_file = ".venv/.coverage"
